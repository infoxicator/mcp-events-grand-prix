<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"><style>*{margin:0}#v{width:100vw;height:100vh}canvas{display:block}.model-loading{display:none}</style><div id="v"></div><script type="module">
import * as T from 'three';
import {getTrack} from '/src/race/track.ts';
import {createScene} from '/src/race/scene.ts';
import {circuitHeight} from '/src/race/elevation.ts';
import {createRace,stepRace} from '/src/race/physics.ts';
const params=new URLSearchParams(location.search),id=params.get('circuit')||'monza',track=getTrack(id),L=track.LENGTH;
const pt=(s,x,y)=>{const p=track.pointAt(s,x);return new T.Vector3(p.x,circuitHeight(id,s)+y,p.z)};
const bay=L-180,garage=L-184,stand=id==='monza'?L-160:L-230,base=id==='monza'?35:22;
const views={
 face:[pt(garage+.16,-25.1,1.68),pt(garage,-26.3,1.62),32],
 suit:[pt(garage-.30,-24.65,1.28),pt(garage,-26.3,1.29),35],
 stand:[pt(stand-4,base-8,4.7),pt(stand+3,base+5,4.6),54],
 fans:[pt(stand-2,base-2.7,2.6),pt(stand,base+1.8,2.7),44],
 stop:[pt(bay+5.8,-12.9,3.5),pt(bay-.1,-18,.76),47],
 wheel:[pt(bay+3.9,-15.3,1.4),pt(bay+1.43,-17.3,.65),47]};
const view=params.get('view')||'stop',v=views[view],original=T.PerspectiveCamera.prototype.updateProjectionMatrix;
T.PerspectiveCamera.prototype.updateProjectionMatrix=function(){if(this.far===5000&&this.near===.06){this.position.copy(v[0]);this.up.set(0,1,0);this.lookAt(v[1]);this.fov=v[2];}return original.call(this)};
const scene=createScene(document.querySelector('#v'),track);scene.setMode('chase');
const race=createRace(3,id);race.phase='racing';Object.assign(race.cars.a,{distance:bay-13,pit:'entry',offset:-18,speed:11});race.cars.a.instruction.tyre='medium';race.cars.b.distance=bay-400;
const snapshots=[];let stop=-1;
for(let i=0;i<1600;i++){if(stop<0&&race.cars.a.pit==='stopped')stop=i;snapshots.push(structuredClone(race));stepRace(race)}
if(stop<0)throw Error('Simulated car missed its pit stop');
window.draw=(t=0)=>{const r=snapshots[Math.max(0,Math.min(snapshots.length-1,stop+Math.round(t*120)))];scene.render(r,10000+r.time*1000);return {...scene.info,pit:r.cars.a.pit,pitTime:r.cars.a.pitTime}};
function init(){const x=window.draw();if(x.modelsReady)window.ready=true;else if(x.modelError)throw Error(x.modelError);else requestAnimationFrame(init)}init();
</script>
